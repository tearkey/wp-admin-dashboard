# Example Docker Compose setup for self-hosting Techtrick CMS.
#   docker compose up --build     # build and run at http://localhost:3000
services:
  techtrick-cms:
    build: .
    # Or run a prebuilt image instead of building locally:
    # image: ghcr.io/techtrick/techtrick-cms:latest
    container_name: techtrick-cms
    ports:
      - "3000:3000"
    # Copy .env.example to .env first (see that file for the available settings).
    env_file:
      - .env
    restart: unless-stopped
    # The app does not terminate TLS. Put it behind a reverse proxy in production,
    # for example Traefik:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.techtrick.rule=Host(`cms.example.com`)"
    #   - "traefik.http.routers.techtrick.entrypoints=websecure"
    #   - "traefik.http.routers.techtrick.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.techtrick.loadbalancer.server.port=3000"
    #
    # ...or Caddy, with a Caddyfile containing:
    #   cms.example.com {
    #     reverse_proxy techtrick-cms:3000
    #   }
