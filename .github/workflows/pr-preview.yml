name: PR preview image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Fork PRs get a read-only GITHUB_TOKEN, so the image is built but not pushed.
      - name: Check if the PR can push
        id: perms
        run: echo "push=${{ github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.perms.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.perms.outputs.push == 'true' }}
          load: ${{ steps.perms.outputs.push != 'true' }}
          tags: |
            ${{ steps.img.outputs.name }}:pr-${{ github.event.pull_request.number }}
            ${{ steps.img.outputs.name }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment the preview instructions
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          PUSHED: ${{ steps.perms.outputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const marker = '<!-- techtrick-pr-preview -->';
            const tag = `${process.env.IMAGE_NAME}:pr-${context.payload.pull_request.number}`;
            const sha = context.payload.pull_request.head.sha;
            const pushed = process.env.PUSHED === 'true';
            const built = new Date().toISOString();

            const body = pushed
              ? [
                  marker,
                  '### Preview build ready',
                  '',
                  `Run this PR locally:`,
                  '',
                  '```sh',
                  `docker run --rm -p 3000:3000 ${tag}`,
                  '```',
                  '',
                  'Then open <http://localhost:3000/admin>.',
                  '',
                  `| | |`,
                  `|---|---|`,
                  `| Image | \`${tag}\` |`,
                  `| Digest | \`${process.env.DIGEST || 'n/a'}\` |`,
                  `| Commit | \`${sha}\` |`,
                  `| Built | ${built} |`,
                ].join('\n')
              : [
                  marker,
                  '### Preview build ready',
                  '',
                  'This PR comes from a fork, so the image was built and verified but not pushed to the registry.',
                  'Build and run it locally instead:',
                  '',
                  '```sh',
                  `gh pr checkout ${context.payload.pull_request.number}`,
                  'docker build -t techtrick-cms:preview .',
                  'docker run --rm -p 3000:3000 techtrick-cms:preview',
                  '```',
                  '',
                  'Then open <http://localhost:3000/admin>.',
                  '',
                  `| | |`,
                  `|---|---|`,
                  `| Commit | \`${sha}\` |`,
                  `| Built | ${built} |`,
                ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete the PR image tag
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const pkg = context.repo.repo;
            const tag = `pr-${context.payload.pull_request.number}`;
            const isOrg = context.payload.repository.owner.type === 'Organization';
            const list = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const params = isOrg
              ? { package_type: 'container', package_name: pkg, org: context.repo.owner, per_page: 100 }
              : { package_type: 'container', package_name: pkg, username: context.repo.owner, per_page: 100 };

            const versions = await github.paginate(list, params);
            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];
              if (!tags.some((t) => t === tag || t.startsWith(`${tag}-`))) continue;
              const del = isOrg
                ? github.rest.packages.deletePackageVersionForOrg
                : github.rest.packages.deletePackageVersionForUser;
              await del(
                isOrg
                  ? { package_type: 'container', package_name: pkg, org: context.repo.owner, package_version_id: v.id }
                  : { package_type: 'container', package_name: pkg, username: context.repo.owner, package_version_id: v.id },
              );
              core.info(`Deleted image version ${v.id} (${tags.join(', ')})`);
            }
